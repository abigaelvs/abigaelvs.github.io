<body>
    <div id="app" role="status" aria-label="Loading">
        <div class="mx-auto mt-[40vh] size-10 animate-spin rounded-full border-[3px] border-primary/30 border-t-primary"></div>
    </div>
    <noscript><p style="padding:2rem;text-align:center">This site needs JavaScript enabled to run.</p></noscript>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        window.scrollToId = id => document.getElementById(id)?.scrollIntoView();

        // Header shadow after 80px and nav scrollspy, like the old site. Blazor never touches these data attributes.
        (() => {
            let queued = false;
            const update = () => {
                queued = false;
                document.querySelector('[data-header]')?.toggleAttribute('data-scrolled', scrollY >= 80);
                let active = null;
                document.querySelectorAll('section[id]').forEach(s => {
                    const top = s.offsetTop - 50;
                    if (scrollY > top && scrollY <= top + s.offsetHeight) active = s.id;
                });
                document.querySelectorAll('[data-nav]').forEach(a => a.toggleAttribute('data-active', a.dataset.nav === active));
            };
            const queue = () => { if (!queued) { queued = true; requestAnimationFrame(update); } };
            addEventListener('scroll', queue, { passive: true });
            addEventListener('resize', queue);
            new MutationObserver(queue).observe(document.body, { childList: true, subtree: true });
        })();
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>
